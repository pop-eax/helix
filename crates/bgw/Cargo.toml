[package]
name = "bgw"
version.workspace = true
edition.workspace = true

[dependencies]
ir = { path = "../ir" }
runtime = { path = "../runtime" }
rand = { version = "0.8", features = ["getrandom"] }
sha2 = "0.10"
# ark crates are only needed by commit.rs (BLS12-381 Feldman VSS)
ark-bls12-381 = "0.5.0"
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-serialize = "0.5.0"
ark-std = { version = "0.5.0", features = ["getrandom"] }

[dev-dependencies]
net   = { path = "../net" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
